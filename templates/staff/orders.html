{% extends 'staff/base.html' %}{% block heading_extra %}<span class="quiet-label">All fulfilment types</span>{% endblock %}{% block content %}
<div class="toolbar"><nav class="tabs" aria-label="Order queues"><a href="?status=live" {% if status == 'live' %}aria-current="page"{% endif %}>Live queue</a><a href="?status=received" {% if status == 'received' %}aria-current="page"{% endif %}>Received</a><a href="?status=preparing" {% if status == 'preparing' %}aria-current="page"{% endif %}>Preparing</a><a href="?status=completed" {% if status == 'completed' %}aria-current="page"{% endif %}>Completed</a><a href="?status=all" {% if status == 'all' %}aria-current="page"{% endif %}>All orders</a></nav></div>
<form method="get" class="filters"><input type="hidden" name="status" value="{{ status }}"><div class="field"><label for="order-search">Reference or location</label><input id="order-search" name="q" value="{{ q }}" placeholder="Search the queue" type="search"></div><div class="field"><label for="fulfilment-filter">Fulfilment</label><select name="fulfilment" id="fulfilment-filter"><option value="">All</option><option value="dine_in" {% if fulfilment == 'dine_in' %}selected{% endif %}>Dine-in</option><option value="delivery" {% if fulfilment == 'delivery' %}selected{% endif %}>Delivery</option><option value="pickup" {% if fulfilment == 'pickup' %}selected{% endif %}>Pickup</option></select></div><div class="field"><label for="payment-filter">Payment</label><select name="payment" id="payment-filter"><option value="">All</option><option value="pending" {% if payment == 'pending' %}selected{% endif %}>Pending payment verification</option></select></div><button class="button secondary">Search</button>{% if q %}<a class="text-link" href="?status={{ status }}">Clear search</a>{% endif %}</form>
<div class="refresh-bar"><span id="refresh-status" role="status">Updates every 20 seconds while idle</span><button type="button" class="text-button" id="refresh-queue" hidden>Refresh queue</button></div><div id="queue-region" data-live-queue>{% include 'staff/partials/order_queue.html' %}</div>{% endblock %}
